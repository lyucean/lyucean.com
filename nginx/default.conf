proxy_cache_path /var/cache/nginx/html levels=1:2 keys_zone=WPHTML:32m inactive=12h max_size=128m use_temp_path=off;
proxy_cache_path /var/cache/nginx/static levels=1:2 keys_zone=WPSTATIC:16m inactive=7d max_size=256m use_temp_path=off;

# Docker embedded DNS: иначе после recreate WordPress nginx держит старый IP.
resolver 127.0.0.11 valid=10s ipv6=off;

map $http_cookie $skip_cookie {
    default 0;
    ~*wordpress_logged_in 1;
    ~*wp-postpass         1;
    ~*comment_author      1;
}

map $request_uri $skip_uri {
    default 0;
    ~*^/wp-admin           1;
    ~*^/wp-login\.php      1;
    ~*^/wp-json            1;
    ~*^/xmlrpc\.php        1;
    ~*admin-ajax\.php      1;
    ~*[?&]preview=         1;
    ~*[?&]s=               1;
}

map $request_method $skip_method {
    default 0;
    POST    1;
}

map $upstream_cache_status $html_cache_control {
    HIT     "public, max-age=120";
    MISS    "public, max-age=120";
    EXPIRED "public, max-age=120";
    STALE   "public, max-age=120";
    UPDATING "public, max-age=120";
    default "private, no-store";
}

server {
    listen 80 default_server;
    server_name lyucean.com www.lyucean.com;

    client_max_body_size 64m;

    set $wp_upstream wordpress:80;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Connection "";
    # Кэшируем распакованное тело, gzip делает nginx. Иначе HIT может отдать gzip клиенту без Accept-Encoding.
    proxy_set_header Accept-Encoding "";
    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml image/svg+xml;
    proxy_hide_header X-Powered-By;
    proxy_hide_header Cache-Control;
    proxy_hide_header Expires;
    proxy_hide_header Pragma;
    proxy_ignore_headers Set-Cookie Cache-Control Expires Vary;
    proxy_buffers 16 16k;
    proxy_buffer_size 32k;

    location ~* \.(?:css|js|png|jpe?g|gif|ico|svg|webp|woff2?|ttf|eot)$ {
        proxy_pass http://$wp_upstream;
        proxy_cache WPSTATIC;
        proxy_cache_key $http_host$uri$is_args$args;
        proxy_cache_valid 200 301 302 7d;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_lock on;
        add_header X-Cache $upstream_cache_status always;
        add_header Cache-Control "public, max-age=604800, immutable" always;
        expires 7d;
    }

    location / {
        proxy_pass http://$wp_upstream;
        proxy_cache WPHTML;
        proxy_cache_key $http_host$request_uri;
        proxy_cache_valid 200 20m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_lock on;
        proxy_cache_bypass $skip_cookie $skip_uri $skip_method;
        proxy_no_cache $skip_cookie $skip_uri $skip_method;
        add_header X-Cache $upstream_cache_status always;
        add_header Cache-Control $html_cache_control always;
    }
}
